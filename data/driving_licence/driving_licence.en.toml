# English rendering of the research notes for the driving-licence database.
# Authority names, place names, official document titles, legal citations and URLs stay as published.

[translations.CH]
deadline_and_exams = "Reviewed on 2026-09-23 against the consolidated text effective 2026-01-01 in the Fedlex filestore (680 KB; not the SPA shell). DEADLINE, Art. 42 para. 3bis let. a: a Swiss driving licence is required after a person has resided in Switzerland for twelve months, provided they have not been abroad for more than three consecutive months during that period. CORRECTION: an earlier note said twelve months from entry; the text says residence, subject to the three-month condition. EXAMS, Art. 44: the general rule is a control drive for everyone (para. 1); it cannot be repeated (para. 1bis); an unjustified absence counts as a failed attempt (para. 1ter); failing means the foreign licence is withdrawn (aberkannt, para. 1quater); professional driving also requires a theory test (para. 2). COUNTRY EXEMPTIONS are not in the VZV. Art. 150 para. 5 let. e authorizes ASTRA to waive the control drive and theory test for countries with equivalent requirements. The list is in Anhang 2 of Weisung ASTRA Fuehrerausweise von Personen mit Wohnsitz im Ausland (01.10.2013, status 15.07.2021), https://www.astra.admin.ch/dam/de/sd-web/IMv9s3nPw9yY/fuehrerausw-wohnsizt-ausland.pdf — the same document linked by SVSA Bern. Group A: exempt from the control drive AND professional theory test: EU/EFTA plus Grossbritannien (31 countries). Group B: exempt from the control drive ONLY: Andorra, Australien, Israel, Japan, Kanada, Korea (Republik), Marokko, Monaco, Neuseeland, San Marino, Singapur, Taiwan (ONLY categories A1 and B), Tunesien, USA. The ASTRA blog dated 27.10.2023 gives the same lists without Taiwan's restriction: cite the Weisung. Cantons repeat these rules; they do not set them. SOURCES §9.1, §9.8"

[translations.BE]
procedure = "Reviewed on 2026-09-23. Deadline: after more than 12 months of residence, using the Einreisedatum shown on the valid Aufenthaltsbewilligung; early submission is recommended. Steps: signed Gesuchsformular with a colour photo; Sehtest by a doctor or optometrist in Switzerland, valid for 24 months; for the first application, documents must be submitted IN PERSON, including at the Einwohnerkontrolle; subsequent submissions can be online or by post. PRINTED FEES: Umtausch des auslaendischen Fuehrerausweises CHF 120.-; reissue of a former Swiss licence CHF 40.-. PROBATIONARY LICENCE: if the foreign licence is less than one year old on entry, a Fuehrerausweis auf Probe is issued, with the required training (Weisung ASTRA dated 26.01.2009). For the Kontrollfahrt, the page refers to Anhang 2 of the Weisung ASTRA cited in the CH entry. EU/EFTA group 2 professional licences can be used for 12 months from entry. Office: Schermenweg 5, 3001 Bern. WARNING: the old domain svsa.pom.be.ch is DEAD (HTTP 000), although web searches still return it. SOURCES §9.4"

[translations.GR]
procedure = "Reviewed on 2026-09-24 using the Gesuch um Umtausch eines auslaendischen Fuehrerausweises form (3 pages), linked from Formulare und Merkblätter. Sehtest by an optician or authorized doctor; applicants who do not yet have a Swiss permit must appear IN PERSON at the Gemeindekanzlei/Einwohnerkontrolle with identification; that office forwards the form. The photo can be attached or submitted online. A medical questionnaire is required, with a certificate if any answer is yes. The exchange form lists Ringstrasse 2, 7000 Chur, and Cho d Punt 53, 7503 Samedan. The official website lists Rohanstrasse 5 for administrative measures, not as the exchange counter. The general Fuehrerausweise page does NOT cover exchange; the source is the form. stva.gr.ch has an incomplete SSL chain; gr.ch/DE/institutionen/.../stva/ responds cleanly (SOURCES §9.7). It also publishes Antrag_und_Umtausch_Fuehrerausweis_RM.pdf in Romansh. SOURCES §9.5"

[translations.TI]
procedure = "Reviewed on 2026-09-23. Since 17.11.2025, applications are made EXCLUSIVELY ONLINE through a guided process; all attachments are scanned and uploaded. The only exception is the original foreign licence, which must be mailed or delivered at the Camorino counter. Deadline: 12 months from the date of entry into Switzerland. PRINTED FEES: Fr. 150.- without professional categories; Fr. 200.- with them; exams and medical visits are charged separately. Wait time is 1–2 weeks after receipt of the original; applicants are advised not to drive abroad in the meantime. Colour photo on photographic paper, with a plain light background. For some countries, the foreign licence is returned to the issuing state. Landing page found through the asa registry, checked on 2026-09-22."

[translations.VD]
procedure = "Reviewed on 2026-09-24. The federal wording is repeated: residence for more than twelve months, with no more than three consecutive months abroad. Complete FORMULAIRE 220, gather the documents listed on the form for the relevant category, then submit by post or at the counter. SAN offices: Aigle, Lausanne, Nyon, Yverdon-les-Bains; the licence arrives by post in 2–3 business days. Fees are listed on page 6 of the form and in Reglement RE-SAN, not on the page itself. The page lists a licence obtained BEFORE entering Switzerland as a condition; if it was obtained later, contact SAN to determine whether exchange is possible. After more than 5 YEARS of residence, a control drive is required if the person has not driven regularly; this can be avoided with an attestation de conduite reguliere (see LU note). This is SAMPLE QUESTION #2: the procedure is here; the time limit is federal. SOURCES §9.3"

[translations.ZH]
procedure = "Reviewed on 2026-09-23. Deadline: 12 months from entry. Printed Gesuch; Sehtest at an optician or medical practice in Switzerland, valid for 2 years. For a first application, identity must be confirmed IN PERSON at the municipal Einwohnerkontrolle or at the StVA. Photo: attach it when applying at the municipality (on photographic paper; scans and home prints are not accepted); at the StVA, a phone photo can be taken and uploaded through an SMS link at the counter. Form: ZFO104AUSL. The correct page is under zh.ch/de/mobilitaet/...; strassenverkehrsamt.zh.ch does NOT resolve. Fees were not found on the page. Landing page found through the asa registry, checked on 2026-09-22."

[translations.AG]
procedure = "Reviewed on 2026-09-23 using the Merkblatt and SmartServicePortal page (ag.ch/de/smartserviceportal/dienstleistungen?dl=umtausch-eines-auslaendischen-fuehrerausweises-...). Gesuch including Sehtest; colour passport photo 35x45; translation required if the licence is not in DE/FR/IT/EN, from a consulate/embassy in Switzerland or a translator accepted by the StVA; Kontrollfahrt includes manoeuvres and emergency braking, with the deadline set after the complete application is filed. Send to: Strassenverkehrsamt Aargau, Fuehrerzulassung, Postfach, 5001 Aarau. Fees: the Merkblatt refers to the website but does NOT print them. The Merkblatt says nach Ablauf eines Jahres seit Einreise — canton wording; federal law says residence (see CH entry). The asa registry URL redirects to /de/themen/mobilitaet-verkehr/strassenverkehr. Landing page found through the asa registry, checked on 2026-09-22."

[translations.AI]
procedure = "Reviewed on 2026-09-23. The Umschrieb auslaendischer Fuehrerausweise page says a Swiss licence is required after more than one year of residence; the Gesuch can be filed at any time, including before the 12 months have elapsed. PROFESSIONAL DRIVERS: EU/EFTA licence holders have 12 months; holders of a cross-border permit or a 60/90/120-day permit do not need to exchange it; all others must do so before their first professional trip. Also covers Swiss residents who obtain a licence abroad: it is recognized only after at least 12 consecutive months of residence in the issuing state, which must be proven (flight tickets, confirmations). Fees are not printed on the page. Landing page found through the asa registry, checked on 2026-09-22."

[translations.AR]
procedure = "Reviewed on 2026-09-23. The Gesuch must be submitted IN PERSON at the Einwohneramt of the municipality of residence (for cross-border commuters: the municipality of employment), with photo identification; the Einwohneramt forwards it to the StVA. Photo must meet passport/ID requirements; digital photos are also accepted. For C, C1, D1, D or BPT: medical examination level 2, with the certificate attached to the Gesuch. The page about the Kontrollfahrt is under Fuehrerpruefung. Office: Landsgemeindeplatz 5, 9043 Trogen. Fees are not printed on the page. Landing page found through the asa registry, checked on 2026-09-22."

[translations.BL]
procedure = "Reviewed on 2026-09-23; read in a BROWSER: baselland.ch returns 403 to curl, even with a browser User-Agent (WAF), so the source must be collected at build time. Five steps: 1) download the Gesuch um Umschrieb eines auslaendischen Fuehrerausweises; 2) Sehtest by an optician or ophthalmologist, with identification; eyeglass prescriptions are NOT accepted; 3) confirm details IN PERSON at the municipal Einwohnerkontrolle, which forwards the Gesuch directly to the MFK; 4) attachments: Gesuch, colour photo on photographic paper 35x45, Sehtest no more than 2 years old, original foreign licence, copy of residence permit; 5) fees are in the Fuehrerzulassung fee list and are NOT printed on this page. Rules for a probationary licence (Zweiphasenausbildung) may also apply to the exchange. MFK office: Ergolzstrasse 1, 4414 Fuellinsdorf."

[translations.BS]
procedure = "Reviewed on 2026-09-24. Submit the Gesuch IN PERSON at the MFK counter, Clarastrasse 38, 2nd floor. Attachments: form completed electronically, printed and signed, no more than 3 MONTHS old, with Sehtest (valid 24 months, at the applicant's expense; prescriptions are not accepted); passport/ID or residence permit, as applicable; valid foreign licence, with a certified official translation if it is not in DE/EN/FR/IT; photo 35x45. INTERNAL DEADLINE: file the Gesuch AT LEAST ONE MONTH before the 12-month period ends. For C, C1, D, D1, BPT: medical examination level 2; form available at the counter. FEES PRINTED ON THIS PAGE: CHF 65 for opening the application and CHF 75 for the first card-format licence; subject to change. The asa registry URL (polizei.bs.ch) redirects to bs.ch/jsd/polizei/..."

[translations.FR]
procedure = "Reviewed on 2026-09-23 using the OCN page (ocn.ch/fr/changements-de/pays-arrivee-en-suisse) and information document dated 19.05.2025. Exchange within 12 months (entry date according to the residence permit); licence and plates. Attachments: formulaire d'echange, original licence (if characters are non-Latin: translation by a recognized translator), colour photo 35x45 ON PHOTOGRAPHIC PAPER — photos sent by email are not accepted. For C/C1/D/D1, original certificat de capacite. PRINTED FLAT FEES: without control drive Fr. 80.-; with control drive, category B Fr. 260.-; categories C, C1, D1, BPT Fr. 345.-; category D Fr. 400.-; certificat de capacite Fr. 35.-. The official domain is ocn.ch, NOT fr.ch; bilingual /fr and /de. Office: Route de Tavel 10, 1700 Fribourg."

[translations.GE]
procedure = "Reviewed on 2026-09-24. Apply within 12 months. Appear IN PERSON, without an appointment, at the service des permis de conduire counters; appointments can also be booked online. Required: formulaire d'echange, passport/ID or foreign residence permit as applicable, an eye-test certificate from an approved optician less than 24 months old, one colour passport photo, and the ORIGINAL VALID FOREIGN LICENCE. Depending on the issuing country, an official translation or proof of licence holding may be required. Depending on the country, a control drive and/or theory test is required. PRINTED FEES: CHF 150.- (except C, C1, D); CHF 200.- for C, C1, D. Counter hours: Monday 9–16, Tuesday–Friday 7:30–16. OCV, Route de Veyrier 86, 1227 Carouge. Landing page found through the asa registry, checked on 2026-09-22."

[translations.GL]
procedure = "Reviewed on 2026-09-23. Gesuch including Sehtest, colour photo, original foreign licence and copy of residence permit. For C, C1, D, D1, BPT: medical examination level 2. Professional use: additional theory test on ARV and tachograph, in addition to the control drive. The page reproduces both country exemption lists with the same wording as Weisung ASTRA Anhang 2. The control drive can be taken only once; failing or an unjustified absence means the licence is withdrawn (aberkannt). Categories waived from the control drive can be reacquired only through the ordinary process. Fees are not printed on the page. Landing page found through the asa registry, checked on 2026-09-22."

[translations.JU]
procedure = "Reviewed on 2026-09-24 against the Permis de conduire etranger section of the OVJ driver page. Repeats the federal rule: residence for more than twelve months, with no more than three consecutive months abroad. Required: signed exchange application, colour passport photo less than one year old, original valid foreign licence, and a copy of the residence permit. A written waiver is needed only for categories not being exchanged. Licences in non-Latin characters need a consular or embassy translation, or a recognized translator if that is impossible. French licence holders also need an attestation de droits a conduire securisee (RII). Additional documents are listed for professional categories; licences from countries outside table A require a certificate of authenticity or a police check. The page does not specify email as an exchange submission channel; its email instructions concern a different service. Fees: see Taxe et emoluments page; not reviewed."

[translations.LU]
procedure = "Reviewed on 2026-09-23. Numbered forms: Nr. 12a Gesuch um Umtausch, Nr. 13 Verzicht Kategorien. Colour photo; certified translation if the licence is not in Latin script; the StVA may also require one if it is not in DE or EN. Control drives take place in Kriens. FIVE-YEAR RULE: anyone exchanging a licence from an exempt state MORE THAN FIVE YEARS after entry must still take the control drive. The same rule appears in TG, VD and ZG (in VD and ZG it can be avoided with proof of regular driving), so it is NOT an isolated practice; however, it is NOT in Weisung ASTRA Anhang 2 (searched with no match), and its federal source has not been found. EU/EFTA group 2 licences can be used for 12 months from entry. Office: Arsenalstrasse 45, 6010 Kriens. Fees are not printed on the page. Landing page found through the asa registry, checked on 2026-09-22. SOURCES §9.8"

[translations.NE]
procedure = "Reviewed on 2026-09-24. The SCAN page covers cars and motorcycles; there is a separate page for professional categories. A foreign licence can be used for PRIVATE trips for no more than 12 months after arrival. Steps: fill in and PRINT the exchange application, take an eye test with an optician APPROVED by SCAN, transmit photo and signature digitally, then appear at a counter WITHOUT an appointment for mandatory identification. Bring the original valid foreign licence and residence permit. Official translation (embassy, consulate or approved translator) is required if the licence is not in a national language or English. PRINTED FEES: Fr. 105.- for the service; with a control drive, Fr. 120.- for the practical test plus Fr. 105.- for the licence. The official domain is scan-ne.ch."

[translations.NW]
procedure = "Reviewed on 2026-09-23. INTER-CANTONAL OFFICE Verkehrssicherheitszentrum OW/NW; both cantons use the same page and Merkblatt (vsz.ch/40_formulare-und-merkblaetter/Merkblatt_Umtausch_ausl_FA.pdf). Photo and signature can be submitted via E-Service Photo Collect or captured at the counter. Certified translation required if the licence is not in Latin script. The Merkblatt repeats the federal rule (residence for more than twelve months, with no more than three consecutive months abroad) and the Laenderliste under Art. 150 Abs. 5 Bst. e VZV. LOCAL RULE: the control drive must be taken WITHIN THREE MONTHS of filing the Gesuch; the office sets the deadline. Swiss residents who took their test abroad must prove 12 consecutive months in that country. Fees are not printed on the page. Landing page found through the asa registry, checked on 2026-09-22."

[translations.OW]
procedure = "Reviewed on 2026-09-23. Same as NW: one office, Verkehrssicherheitszentrum OW/NW, and the same page and Merkblatt. The control drive must be taken within three months of filing. The asa registry has NO Obwalden entry (SOURCES §9.7). See the NW entry for details."

[translations.SG]
procedure = "Reviewed on 2026-09-23. The Gesuch must be confirmed and signed by the Einwohneramt of the municipality of residence, which forwards it; alternatively, appear in person at the St. Gallen counter. Colour photo 35x45; Sehtest certified on the form. The page includes the Laenderliste for the Kontrollfahrt. The control drive cannot be repeated and is charged in all cases; an unjustified absence means the licence is withdrawn indefinitely (aberkannt). The page cites Art. 29 Abs. 4 VZV for non-repeatability; the current text provides this for foreign licences at Art. 44 Abs. 1bis: do not repeat the canton page's citation. Probationary licence: three years minus the time elapsed since the foreign licence was issued. PRINTED FEES: Fr. 80.- to Fr. 100.- for the exchange; control drive charged separately. Office: Frongartenstrasse 5, St. Gallen. Landing page found through the asa registry, checked on 2026-09-22."

[translations.SH]
procedure = "Reviewed on 2026-09-24 against the dedicated cantonal service page. Download, complete, print and submit the exchange application IN PERSON at the Strassenverkehrs- und Schifffahrtsamt. Bring a 35 x 45 mm colour photo, the original valid foreign licence, identification and, where applicable, the original residence permit. The official application form also requires a Swiss eye test valid for 24 months and identity verification at the cantonal office or municipality. Federal rules additionally govern professional driving. Office: Ernst Mueller-Strasse 2, 8207 Schaffhausen. The service page links to a separate fee regulation; amounts were not extracted. The former general source was a JavaScript-rendered FAQ."

[translations.SO]
procedure = "Reviewed on 2026-09-23; read in a BROWSER: curl receives the page, but the content is in the rendered main element. Procedure follows the first learner-driver licence application, plus: original foreign licence; Swiss applicants must prove the duration of their stay abroad; foreign applicants must provide both sides of their residence permit. Gesuch um Umtausch form (PDF 375 KB) and Merkblatt Wohnsitznahme im Kanton Solothurn are on the page. Offices: Gurzelenstrasse 3, 4512 Bellach (main office), and Pruefstellen Laufen and Wangen bei Olten. Fees are not printed on the page."

[translations.SZ]
procedure = "Reviewed on 2026-09-23. Four steps: Gesuchsformular (also available at the Einwohneramt), Sehtest by an ophthalmologist or optician recorded on the form, photo 35x45 uploaded online or attached (NOT glued), confirmation by the Einwohneramt on the form. The Gesuch must be submitted IN PERSON to the Verkehrsamt. Certified original translation required if the licence is not in Latin script. Exemptions follow the ASTRA list; the deadline for the control drive or theory test is sent by post. Fuehrerzulassung offices: Schlagstrasse 82, 6431 Schwyz; Gwattstrasse 3, 8808 Pfaeffikon. Fees are not printed. URL containing a chain of numeric IDs is fragile. Landing page found through the asa registry, checked on 2026-09-22."

[translations.TG]
procedure = "Reviewed on 2026-09-23. Interactive form must be printed using the button that validates its fields; Sehtest on the form; photo; certified translation from a consulate or embassy in Switzerland if the licence is not in Latin script. Identification at the municipal Einwohnerkontrolle (which forwards the application) or at the StVA; originals must be presented IN PERSON. Control-drive information arrives within 10–14 business days. The control drive is in the highest category on the foreign licence; anyone taking it must THEN also take an additional theory test. More than 5 YEARS after entry, a control drive may be ordered (see LU note). C1, C, D1, D, BPT: medical examination level 2. The asa registry's www.stva.tg.ch is dead (SOURCES §9.7). Fees are not printed."

[translations.UR]
procedure = "Reviewed on 2026-09-23 using the service page Lernfahr- oder Fuehrerausweis / Umtausch eines auslaendischen Fuehrerausweises and its online form. For the first application, appear IN PERSON at Amt fuer Strassen- und Schiffsverkehr, Gotthardstrasse 77a, 6460 Altdorf; the photo is taken on site. The Merkblatt fuer Umtausch indexed by search engines (_docn/78095) returns 404: the deep link is dead. Fees are not printed on the page."

[translations.VS]
procedure = "Reviewed on 2026-09-23. Foreign licence is valid for 12 months after arrival (entry date shown on the residence permit). Documents (signed application, colour photo, original licence, copy of residence permit; for professional categories, medical certificate and criminal-record extract) must be submitted to the municipality's residents' registration office in Valais. PRINTED FEES: CHF 70.- processing, CHF 53.50 issue of Swiss licence, CHF 20.- authorization card (only with a control drive), CHF 90.- to 180.- control drive (CHF 90 for category B), CHF 60.- supplementary theory test (C, CE, C1, D, D1, TPP). For the control drive, bring your own vehicle and a companion with a valid licence. The asa registry points to vs.ch/de/autos, which redirects to vs.ch/web/scn."

[translations.ZG]
procedure = "Reviewed on 2026-09-24 using the Merkblatt Umschreibung auslaendischer Fuehrerausweis. Appear IN PERSON at StVA Zug, without an appointment, with: completed Gesuch um Umtausch and Zusatzangaben zum Umtausch forms, one colour photo, ORIGINAL VALID FOREIGN LICENCE, original residence permit or Swiss passport/ID, and certified translation if the licence is not in Latin script. More than 5 YEARS after entry: control drive, unless regular driving practice is proven. The office does NOT provide the test vehicle. PRINTED FEES: Umtausch Fr. 75.-, FAK Fr. 30.-, category B or A control drive Fr. 90.-, rescheduling Fr. 50.-, withdrawal (Aberkennung) Fr. 250.-, additional theory Fr. 30.-, Faehigkeitsausweis Fr. 35.-. For Taiwan, the ASTRA Annex 2 restriction to Swiss categories A1 and B takes precedence over the broader unqualified wording in this cantonal leaflet."
