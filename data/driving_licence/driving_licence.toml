notes = "RICONTROLLATO 2026-09-24 sul modulo Gesuch um Umtausch eines auslaendischen Fuehrerausweises (3 pagine), linkato dalla pagina Formulare und Merkblaetter. Sehtest da ottico o medico autorizzato; chi non ha ancora un permesso svizzero deve presentarsi PERSONALMENTE alla Gemeindekanzlei/Einwohnerkontrolle con documento, che inoltra il modulo; foto da incollare o online; questionario medico, con certificato se una risposta e si. Il modulo di scambio riporta Ringstrasse 2, 7000 Chur e Cho d Punt 53, 7503 Samedan. Rohanstrasse 5 e indicata dal sito come sede delle Administrativmassnahmen, non come sportello per questo scambio. La pagina generale sui Fuehrerausweise NON tratta la conversione: la fonte e il modulo. stva.gr.ch ha una catena SSL incompleta; gr.ch/DE/institutionen/.../stva/ risponde pulito (SOURCES §9.7). Pubblica anche Antrag_und_Umtausch_Fuehrerausweis_RM.pdf in ROMANCIO. SOURCES §9.5"

