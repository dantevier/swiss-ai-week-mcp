notes = "CHIUSO 2026-09-23. Permesso estero valido 12 mesi dall arrivo (data d ingresso sul permesso di soggiorno). Documenti (domanda firmata, foto a colori, originale del permesso, copia del permesso di soggiorno; per le categorie professionali certificato medico e estratto del casellario) da consegnare al CONTROLLO ABITANTI del comune in Vallese. TASSE STAMPATE: CHF 70.- trattamento, CHF 53.50 emissione del permesso svizzero, CHF 20.- carta di autorizzazione (solo con corsa), CHF 90.- a 180.- corsa di controllo (90 per la B), CHF 60.- esame teorico complementare (C, CE, C1, D, D1, TPP). Alla corsa ci si presenta col proprio veicolo e accompagnati da una persona con permesso valido. Il registro asa punta a vs.ch/de/autos, che redirige su vs.ch/web/scn."

