notes = "CHIUSO 2026-09-23. Dal 17.11.2025 la richiesta si fa ESCLUSIVAMENTE ONLINE con procedura guidata; tutti gli allegati scansionati e caricati. Unica eccezione: la licenza estera originale, spedita per posta o consegnata allo sportello di Camorino. Termine: 12 mesi dalla data di entrata in Svizzera. TASSE STAMPATE: Fr. 150.- senza categorie professionali, Fr. 200.- con; esami e visite fatturati a parte. Attesa 1-2 settimane dalla ricezione dell originale; si sconsiglia di guidare all estero nel frattempo. Foto a colori su carta fotografica, sfondo chiaro uniforme. Per alcuni paesi la licenza estera va rispedita allo Stato di provenienza. Landing dal registro asa, verificata 2026-09-22."

