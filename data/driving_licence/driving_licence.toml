notes = "RICONTROLLATO 2026-09-24. Pagina SCAN per auto e moto; esiste una pagina separata per le categorie professionali. Permesso estero usabile per viaggi PRIVATI al massimo 12 mesi dall arrivo. Passi: compilare e STAMPARE la domanda di scambio, test della vista da un ottico AGREE dal SCAN, foto e firma trasmesse digitalmente, poi presentazione agli sportelli SENZA appuntamento con identificazione obbligatoria; portare patente estera originale valida e permesso di soggiorno. Traduzione ufficiale (ambasciata, consolato o traduttore agree) se il permesso non e in una lingua nazionale o in inglese. TASSE STAMPATE: Fr. 105.- per la prestazione; con corsa di controllo Fr. 120.- per l esame pratico piu Fr. 105.- per il permesso. Dominio proprio scan-ne.ch, NON ne.ch. Landing dal registro asa, verificata 2026-09-22."

