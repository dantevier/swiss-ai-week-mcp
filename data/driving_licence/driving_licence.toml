notes = "CHIUSO 2026-09-23. Modulo interattivo da stampare col pulsante che controlla i campi; Sehtest sul modulo; foto; traduzione autenticata da consolato o ambasciata in Svizzera se non in scrittura latina. Identificazione all Einwohnerkontrolle del comune (che inoltra) o allo StVA, originali PERSONALMENTE. Informazioni sulla corsa entro 10-14 giorni lavorativi. Corsa nella categoria piu alta del permesso estero; chi fa la corsa fa POI anche una teoria aggiuntiva. Oltre 5 ANNI dall ingresso puo essere ordinata una corsa (vedi nota LU). C1, C, D1, D, BPT: visita medica livello 2. Il www.stva.tg.ch del registro asa e morto (SOURCES §9.7). Tasse non stampate."

