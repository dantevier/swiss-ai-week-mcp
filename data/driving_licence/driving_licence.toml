# Foreign driving licence exchange: federal rules plus 26 cantonal procedures.
#
# Two levels. The substance (12-month deadline, control drive and country
# exemptions) is federal law and is identical in every canton. Procedure,
# form, fee and office are cantonal. A complete answer cites both levels,
# each from the authority responsible for it; do not cite a cantonal page as
# the source of the federal 12-month rule (BaseKnowledge/SOURCES.md §9.1, §9.3).
#
# on_missing_place = "answer": without a canton, answer the federal level and
# state that the procedure depends on the canton; asking when an answer is
# already possible is penalised (BaseKnowledge/CHALLENGE.md §5.4).
#
# Research notes are kept in English in driving_licence.en.toml.

# --------------------------------------------------------------------------
# Federal level: one entry for all cantons
# --------------------------------------------------------------------------

[[entry]]
theme = "driving_licence_exchange"
jurisdiction = "CH"
subtopic = "deadline_and_exams"
resolution_level = "national"
on_missing_place = "answer"
authority = "Bundesamt für Strassen ASTRA"
authority_level = "federal"
source_url = "https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/1976/2423_2423_2423/20260101/de/html/fedlex-data-admin-ch-eli-cc-1976-2423_2423_2423-20260101-de-html.html"
landing_url = "https://www.fedlex.admin.ch/eli/cc/1976/2423_2423_2423/de"
source_status = "binding"
validated_at = "2026-09-23"
legal_basis = "VZV/OAC, SR 741.51, art. 29, 42-44, 150"

