notes = "CHIUSO 2026-09-23. Pagina Umschrieb auslaendischer Fuehrerausweise: il permesso svizzero serve dopo piu di un anno di residenza; il Gesuch si puo depositare in qualsiasi momento, anche prima dei 12 mesi. Regole per autisti professionali: con permesso UE/AELS 12 mesi di tempo; con permesso frontaliero o da 60/90/120 giorni non serve convertire; tutti gli altri prima del primo viaggio professionale. Copre anche il caso dei residenti svizzeri che prendono la patente all estero: riconosciuta solo con almeno 12 mesi consecutivi di soggiorno nello Stato emittente, da provare (biglietti aerei, conferme). Tasse non stampate sulla pagina. Landing dal registro asa, verificata 2026-09-22."

