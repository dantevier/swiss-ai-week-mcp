notes = "RICONTROLLATO 2026-09-24 sul Merkblatt Umschreibung auslaendischer Fuehrerausweis. Presentarsi PERSONALMENTE allo StVA Zug, senza appuntamento, con: moduli Gesuch um Umtausch e Zusatzangaben zum Umtausch compilati, 1 foto a colori, PATENTE ESTERA ORIGINALE VALIDA, originale del permesso di dimora o passaporto/ID svizzero, traduzione autenticata se non in scrittura latina. Oltre 5 ANNI dall ingresso: corsa di controllo, salvo pratica di guida dimostrata (vedi nota LU). Per la corsa l ufficio NON fornisce il veicolo d esame. TASSE STAMPATE: Umtausch Fr. 75.-, FAK Fr. 30.-, corsa cat. B o A Fr. 90.-, spostamento termine Fr. 50.-, Aberkennung Fr. 250.-, teoria aggiuntiva Fr. 30.-, Faehigkeitsausweis Fr. 35.-. Per Taiwan vale la restrizione dell Anhang 2 ASTRA alle categorie svizzere A1 e B; il Merkblatt cantonale riporta un elenco piu ampio senza tale precisazione. Landing dal registro asa, verificata 2026-09-22."

