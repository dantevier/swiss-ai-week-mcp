notes = "CHIUSO 2026-09-23. Moduli numerati: Nr. 12a Gesuch um Umtausch, Nr. 13 Verzicht Kategorien. Foto a colori; traduzione autenticata se il permesso non e in scrittura latina, e lo StVA puo esigerla se non e in DE o EN. Corse di controllo a Kriens. REGOLA DEI CINQUE ANNI: chi converte un permesso di uno Stato esente PIU DI CINQUE ANNI dopo l ingresso deve fare comunque la corsa di controllo. La stessa regola compare a TG, VD e ZG (a VD e ZG evitabile con un attestato di guida regolare), quindi NON e prassi isolata; ma NON sta nella Weisung ASTRA Anhang 2 (cercato, nessuna occorrenza) e la sua fonte federale non e stata trovata. Permessi UE/AELS gruppo 2 usabili 12 mesi dall ingresso. Sede Arsenalstrasse 45, 6010 Kriens. Tasse non stampate sulla pagina. Landing dal registro asa, verificata 2026-09-22. SOURCES §9.8"

