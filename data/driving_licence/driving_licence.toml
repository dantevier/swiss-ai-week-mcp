# Cambio patente estera — federale + 26 cantoni.
#
# Tema a DUE LIVELLI, ed è la sua caratteristica distintiva: la sostanza
# (termine di 12 mesi, corsa di controllo per paese) è diritto federale e vale
# identica per tutti i 26 cantoni; procedura, modulo, tassa e sede sono
# cantonali. Una risposta completa cita ENTRAMBI i livelli, ciascuno
# dall autorità competente per la sua parte (SOURCES §9.1, §9.3).
#
# Citare la pagina cantonale come fonte del termine di 12 mesi attribuisce una
# norma federale all autorità sbagliata -> review checklist punto 3.
#
# on_missing_place = "ask" non serve mai qui: senza cantone si risponde
# comunque il livello federale e si dichiara che la procedura dipende dal
# cantone. Chiedere quando si può già rispondere è penalizzato (CHALLENGE §5.4).

# --------------------------------------------------------------------------
# Livello federale — una riga per 26 cantoni
# --------------------------------------------------------------------------

[[entry]]
theme = "driving_licence_exchange"
jurisdiction = "CH"
subtopic = "deadline_and_exams"
resolution_level = "national"
on_missing_place = "answer"
authority = "Bundesamt für Strassen ASTRA"
authority_level = "federal"
source_url = "https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/1976/2423_2423_2423/20260101/de/html/fedlex-data-admin-ch-eli-cc-1976-2423_2423_2423-20260101-de-html.html"
landing_url = "https://www.fedlex.admin.ch/eli/cc/1976/2423_2423_2423/de"
source_status = "binding"
validated_at = "2026-09-23"
legal_basis = "VZV/OAC, SR 741.51, art. 29, 42-44, 150"
notes = "CHIUSO 2026-09-23 sul testo consolidato 01.01.2026 del filestore Fedlex (680 KB, non lo shell SPA). TERMINE, art. 42 cpv. 3bis lett. a: serve la patente svizzera a chi ABITA in Svizzera da dodici mesi e in quel periodo non e stato all estero per piu di tre mesi di fila. CORREZIONE: la nota diceva 12 mesi dall entrata in Svizzera; il testo dice residenza, con la condizione dei tre mesi. ESAMI, art. 44: la regola generale e la CORSA DI CONTROLLO per tutti (cpv. 1), non ripetibile (cpv. 1bis), assenza ingiustificata = non superata (1ter), bocciatura = aberkannt il permesso estero (1quater); per l uso professionale anche una prova di teoria (cpv. 2). ESENZIONI PER PAESE: NON stanno nella VZV. L art. 150 cpv. 5 lett. e autorizza ASTRA a rinunciare a corsa e teoria per Stati con requisiti equivalenti; la lista sta nell ANHANG 2 della Weisung ASTRA Fuehrerausweise von Personen mit Wohnsitz im Ausland (01.10.2013, Stand 15.07.2021), https://www.astra.admin.ch/dam/de/sd-web/IMv9s3nPw9yY/fuehrerausw-wohnsizt-ausland.pdf - la stessa che SVSA Bern linka. Gruppo A, esenti da corsa E da teoria professionale: UE/AELS piu Grossbritannien (31 paesi). Gruppo B, esenti SOLO dalla corsa: Andorra, Australien, Israel, Japan, Kanada, Korea (Republik), Marokko, Monaco, Neuseeland, San Marino, Singapur, Taiwan (SOLO categorie A1 e B), Tunesien, USA. Il blog ASTRA del 27.10.2023 riporta le stesse liste senza la restrizione su Taiwan: citare la Weisung. I cantoni RIPETONO queste regole, non le stabiliscono. SOURCES §9.1, §9.8"

