on_missing_place = "answer"
authority = "Strassenverkehrs- und Schifffahrtsamt SVSA"
authority_level = "canton"
source_url = "https://www.svsa.sid.be.ch/de/start/fuehrerausweise/rund-um-fuehrerausweis/umtausch-fuehrerausweis-ausland.html"
landing_url = "https://www.svsa.sid.be.ch/de/start.html"
source_status = "binding"
validated_at = "2026-09-23"
notes = "CHIUSO 2026-09-23. Scadenza: oltre 12 mesi di soggiorno, Einreisedatum gemaess gueltiger Aufenthaltsbewilligung; si consiglia di depositare prima. Passi: Gesuchsformular firmato con foto a colori; Sehtest da medico o optometrista in Svizzera, valido 24 mesi; al primo Gesuch i documenti si portano PERSONALMENTE, anche all Einwohnerkontrolle del comune; poi online o per posta. TASSE STAMPATE: Umtausch des auslaendischen Fuehrerausweises CHF 120.-; riemissione di un ex permesso svizzero CHF 40.-. PERMESSO IN PROVA: se all ingresso il permesso estero ha meno di un anno, si riceve un Fuehrerausweis auf Probe, con la formazione obbligatoria (Weisung ASTRA del 26.01.2009). Per la Kontrollfahrt la pagina rimanda all Anhang 2 della Weisung ASTRA, la stessa citata nella riga CH. Permessi UE/AELS gruppo 2 (professionali) usabili 12 mesi dall ingresso. Sede Schermenweg 5, 3001 Bern. ATTENZIONE: il vecchio dominio svsa.pom.be.ch e MORTO (HTTP 000) ma la ricerca web lo restituisce ancora. SOURCES §9.4"

