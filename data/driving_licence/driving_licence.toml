source_status = "binding"
validated_at = "2026-09-23"
notes = "CHIUSO 2026-09-23. Il Gesuch va confermato e firmato dall Einwohneramt del comune di residenza, che lo inoltra; in alternativa persoenliche Vorsprache allo sportello di St. Gallen. Foto a colori 35x45, Sehtest confermato sul modulo. Pagina con Laenderliste Kontrollfahrt. Corsa non ripetibile e fatturata in ogni caso; assenza ingiustificata = aberkannt a tempo indeterminato. La pagina cita per la non ripetibilita l Art. 29 Abs. 4 VZV; il testo in vigore la prevede per i permessi esteri all Art. 44 Abs. 1bis: citazione cantonale da non riprendere. Permesso in prova: tre anni meno il tempo trascorso dall emissione estera. TASSE STAMPATE: Fr. 80.- bis Fr. 100.- per il cambio, corsa fatturata a parte. Sede Frongartenstrasse 5, St. Gallen. Landing dal registro asa, verificata 2026-09-22."

