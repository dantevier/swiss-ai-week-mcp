notes = "CHIUSO 2026-09-23. UFFICIO INTERCANTONALE Verkehrssicherheitszentrum OW/NW, stessa pagina e stesso Merkblatt per i due cantoni (vsz.ch/40_formulare-und-merkblaetter/Merkblatt_Umtausch_ausl_FA.pdf). Foto e firma via E-Service Photo Collect, o credenziali allo sportello. Traduzione autenticata se non in scrittura latina. Il Merkblatt riprende il testo federale (residenza da piu di dodici mesi, non piu di tre mesi di fila all estero) e la Laenderliste Art. 150 Abs. 5 Bst. e VZV. REGOLA PROPRIA: la corsa di controllo va fatta ENTRO TRE MESI dal deposito del Gesuch; termine fissato dall ufficio. Svizzeri con esame all estero: prova di 12 mesi consecutivi nel paese. Tasse non stampate sulla pagina. Landing dal registro asa, verificata 2026-09-22."

