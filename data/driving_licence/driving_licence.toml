validated_at = "2026-09-24"
notes = "RICONTROLLATO 2026-09-24. Riprende il testo federale: residenza da piu di dodici mesi senza piu di tre mesi di fila all estero. Si compila il FORMULAIRE 220, si riuniscono i documenti elencati sul modulo secondo la categoria, si invia o si va al guichet. Sedi SAN: Aigle, Lausanne, Nyon, Yverdon-les-Bains; il permesso arriva per posta in 2-3 giorni lavorativi. Tasse: pagina 6 del formulario e Reglement RE-SAN, non stampate sulla pagina. La pagina pone come condizione la patente ottenuta PRIMA dell ingresso in Svizzera; se e stata ottenuta dopo, contattare il SAN per sapere se lo scambio e possibile. Oltre 5 ANNI di residenza: corsa di controllo se non si e guidato regolarmente, evitabile con l attestation de conduite reguliere (vedi nota LU). E la DOMANDA CAMPIONE #2: il come e qui, il quanto tempo e federale. SOURCES §9.3"

